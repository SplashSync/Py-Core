# Runs the same checks as `make quality`, from the project virtual environment.
repos:
    -   repo:   local
        hooks:
            -   id:         lint
                name:       ruff check
                entry:      .venv/bin/ruff check
                language:   system
                types:      [python]
            -   id:         style
                name:       ruff format
                entry:      .venv/bin/ruff format --check
                language:   system
                types:      [python]
            -   id:         stan
                name:       mypy
                entry:      .venv/bin/mypy
                language:   system
                pass_filenames: false
                types:      [python]
