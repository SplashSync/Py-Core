# Splash Toolkit 3.0: runs the standard connector suites against the Python fakers.
# Host: toolkit.splashpy.local - IP: 172.169.2.10

services:

    toolkit:
        image:          "splashsync/toolkit:3.0"
        container_name: "toolkit.splashpy.local"
        hostname:       "toolkit.splashpy.local"
        volumes:
            - "./toolkit/splash.yaml:/app/config/packages/splash.yaml:ro"
        networks:
            pycore:         { ipv4_address: 172.169.2.10, aliases: [ toolkit.splashpy.local ] }
            splashsync:     { aliases: [ toolkit.splashpy.local ] }
        depends_on:
            python-3-9:     { condition: service_healthy }
            python-3-10:    { condition: service_healthy }
            python-3-11:    { condition: service_healthy }
            python-3-12:    { condition: service_healthy }
            python-3-13:    { condition: service_healthy }
            python-3-14:    { condition: service_healthy }

networks:
    pycore:
        driver:     bridge
        ipam:
            config:
                - subnet: 172.169.2.0/24
    splashsync:
        external:   true
