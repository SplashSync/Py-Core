# Toolkit 3.0 configuration: one SOAP connection per Python version.

parameters:
    env(SERVER_NAME):   'http://toolkit'
    env(APP_SECRET):    'HXAE37X4DWTprvyLb10F3f7StmRStcZy'

splash:
