################################################################
# Quality: lint, style, security & static analysis
################################################################

quality:
    # Python 3.9: type checking must run against the oldest supported version
    image:      python:3.9-slim
    stage:      Quality
    script:
        - apt-get update -qq && apt-get install -y -qq make > /dev/null
        - make install PYTHON=python
        - make lint style stan
