################################################################
# Defined Pipeline Stages
stages:
    - Quality
    - Functional
    - Builds

variables:
    PIP_CACHE_DIR:      "$CI_PROJECT_DIR/.cache/pip"

cache:
    key:                "pip-$CI_JOB_NAME"
    paths:              [ ".cache/pip" ]

################################################################
# Stages Jobs
include:
    - local:    "ci/Quality.yml"       # lint, style, security & static analysis
    - local:    "ci/Functional.yml"    # tests matrix & Toolkit 3.0 E2E
    - local:    "ci/Builds.yml"        # PyPi packages
