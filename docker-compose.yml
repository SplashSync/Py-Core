# E2E harness: Splash Toolkit 3.0 against the splashpy faker on every Python version.
#
# Network "pycore" (172.169.2.0/24), also attached to the external "splashsync" network:
#
#   Service         Host name                   IP address        Endpoint
#   toolkit         toolkit.splashpy.local      172.169.2.10      http://toolkit.splashpy.local
#   python-3-9      3p9.splashpy.local          172.169.2.39      http://3p9.splashpy.local:8000/splash
#   python-3-10     3p10.splashpy.local         172.169.2.30      http://3p10.splashpy.local:8000/splash
#   python-3-11     3p11.splashpy.local         172.169.2.31      http://3p11.splashpy.local:8000/splash
#   python-3-12     3p12.splashpy.local         172.169.2.32      http://3p12.splashpy.local:8000/splash
#   python-3-13     3p13.splashpy.local         172.169.2.33      http://3p13.splashpy.local:8000/splash
#   python-3-14     3p14.splashpy.local         172.169.2.34      http://3p14.splashpy.local:8000/splash
#
# The "splashsync" network must exist: docker network create splashsync --attachable

name:       "splash-py-core"

include:
    - "docker/toolkit.yml"
    - "docker/python-3.9.yml"
    - "docker/python-3.10.yml"
    - "docker/python-3.11.yml"
    - "docker/python-3.12.yml"
    - "docker/python-3.13.yml"
    - "docker/python-3.14.yml"
